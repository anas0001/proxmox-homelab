---
# Runs on every commit. Blocks secrets and enforces style before code leaves your machine.
# Install:  pip install pre-commit && pre-commit install
minimum_pre_commit_version: "3.5.0"
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks               # blocks commits containing secrets/tokens/keys

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key     # second line of defence for key material
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        args: [--allow-multiple-documents]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.8.0
    hooks:
      - id: ansible-lint
        # The hook declares python3.14 as its default interpreter, which is not
        # yet widely available. ansible-lint 26.x itself supports 3.12, so pin
        # the environment rather than requiring a newer interpreter to commit.
        language_version: python3.12
