---
# Creates the least-privilege identity that every later API-driven role uses.
#
# Why this runs over SSH as root rather than through community.proxmox modules:
# those modules authenticate against the API, and the credential they would
# authenticate with is exactly what this role exists to create. Breaking that
# circle needs an out-of-band channel. `pveum` on the host authenticates through
# the local Unix socket, so the Proxmox root *password* never has to be stored
# anywhere — a better outcome than vaulting it purely to satisfy a module.
#
# `pveum` is a CLI, so idempotence is this role's responsibility rather than a
# module's. Every task reads current state first and acts only on a difference.
# The read tasks set `check_mode: false` so that `--check` runs still have real
# data to evaluate their conditions against.

- name: Probe for the Proxmox management CLIs
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ pve_access_pveum }}"
    - "{{ pve_access_pvesh }}"
  register: pve_access_cli
  changed_when: false
  check_mode: false

- name: Fail early when this is not a Proxmox VE host
  ansible.builtin.assert:
    that:
      - pve_access_cli.results | map(attribute='stat.exists') | select | list | length == 2
    fail_msg: >-
      {{ pve_access_pveum }} and/or {{ pve_access_pvesh }} not found. This role
      targets a Proxmox VE host; the inventory group `pve` is probably pointing
      somewhere unexpected.
    success_msg: "Proxmox VE host confirmed"

# ── Resource pool ──────────────────────────────────────────────────────────
# The pool is the security boundary. VM privileges are granted on /pool/<name>,
# so the token cannot act on a VM that is not a member of it.

- name: Read existing resource pools
  ansible.builtin.command: "{{ pve_access_pvesh }} get /pools --output-format json"
  register: pve_access_pools_raw
  changed_when: false
  check_mode: false

- name: Create the lab resource pool
  ansible.builtin.command: >-
    {{ pve_access_pveum }} pool add {{ pve_access_pool | quote }}
    --comment {{ pve_access_pool_comment | quote }}
  when: >-
    pve_access_pool not in
    (pve_access_pools_raw.stdout | from_json | map(attribute='poolid') | list)
  changed_when: true

# ── Custom roles ───────────────────────────────────────────────────────────
# Two roles rather than one, because VM privileges and storage privileges are
# meaningful at different ACL paths. A single combined role would grant storage
# rights on the pool and VM rights on the storages — both meaningless, and both
# widening the token's nominal reach for no benefit.
#
# The condition is a sorted set comparison, so reordering the privilege lists in
# defaults/ does not read as a change while adding or removing one does. The API
# returns `privs` as a comma-separated string.

- name: Read existing access roles
  ansible.builtin.command: "{{ pve_access_pvesh }} get /access/roles --output-format json"
  register: pve_access_roles_raw
  changed_when: false
  check_mode: false

- name: Create or converge the custom roles
  ansible.builtin.command: >-
    {{ pve_access_pveum }} role
    {{ 'modify' if item.name in pve_access_existing_roles else 'add' }}
    {{ item.name | quote }}
    --privs {{ item.privs | sort | join(',') | quote }}
  loop:
    - name: "{{ pve_access_vm_role }}"
      privs: "{{ pve_access_vm_privs }}"
    - name: "{{ pve_access_storage_role }}"
      privs: "{{ pve_access_storage_privs }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    pve_access_existing_roles: >-
      {{ pve_access_roles_raw.stdout | from_json | map(attribute='roleid') | list }}
  when: >-
    ((pve_access_roles_raw.stdout | from_json
      | selectattr('roleid', 'equalto', item.name)
      | map(attribute='privs') | first | default('')
     ).split(',') | reject('equalto', '') | sort | list)
    != (item.privs | sort | list)
  changed_when: true

# ── Automation user ────────────────────────────────────────────────────────

- name: Read existing users
  ansible.builtin.command: "{{ pve_access_pvesh }} get /access/users --output-format json"
  register: pve_access_users_raw
  changed_when: false
  check_mode: false

- name: Create the automation user
  ansible.builtin.command: >-
    {{ pve_access_pveum }} user add {{ pve_access_user | quote }}
    --comment {{ pve_access_user_comment | quote }}
  when: >-
    pve_access_user not in
    (pve_access_users_raw.stdout | from_json | map(attribute='userid') | list)
  changed_when: true

# ── API token ──────────────────────────────────────────────────────────────
# Created before the ACLs, because `pveum acl modify --tokens` rejects a token
# that does not yet exist ("no such token 'x' for user 'y'"). The secret is
# returned exactly once, at creation, and cannot be retrieved afterwards.

- name: Read existing tokens for the automation user
  ansible.builtin.command: >-
    {{ pve_access_pvesh }} get /access/users/{{ pve_access_user }}/token
    --output-format json
  register: pve_access_tokens_raw
  changed_when: false
  failed_when: false
  check_mode: false

- name: Create the API token
  ansible.builtin.command: >-
    {{ pve_access_pveum }} user token add
    {{ pve_access_user | quote }} {{ pve_access_token_id | quote }}
    --privsep {{ 1 if pve_access_token_privsep else 0 }}
    --output-format json
  register: pve_access_new_token
  when: >-
    pve_access_tokens_raw.rc != 0 or
    pve_access_token_id not in
    (pve_access_tokens_raw.stdout | from_json | map(attribute='tokenid') | list)
  changed_when: true
  # stdout carries the secret; keep it out of Ansible's own logging. The value
  # is surfaced deliberately, once, by the final task.
  no_log: true

# ── Access control entries ─────────────────────────────────────────────────
# With privilege separation enabled, a token's effective rights are the
# intersection of the user's ACLs and the token's own. Granting only one of them
# yields a token that authenticates successfully and is then denied everything,
# which presents as a confusing "bad credential" failure.

- name: Read existing ACL entries
  ansible.builtin.command: "{{ pve_access_pvesh }} get /access/acl --output-format json"
  register: pve_access_acl_raw
  changed_when: false
  check_mode: false

- name: Grant the VM role on the lab pool
  ansible.builtin.command: >-
    {{ pve_access_pveum }} acl modify {{ pve_access_pool_path | quote }}
    --roles {{ pve_access_vm_role | quote }}
    {{ '--tokens' if item.is_token else '--users' }} {{ item.id | quote }}
  loop: "{{ pve_access_principals }}"
  loop_control:
    label: "{{ item.id }}"
  when: >-
    (pve_access_acl_raw.stdout | from_json
     | selectattr('path', 'equalto', pve_access_pool_path)
     | selectattr('roleid', 'equalto', pve_access_vm_role)
     | selectattr('ugid', 'equalto', item.id)
     | list | length) == 0
  changed_when: true

- name: Grant the storage role on each lab storage
  ansible.builtin.command: >-
    {{ pve_access_pveum }} acl modify {{ ('/storage/' ~ item.0) | quote }}
    --roles {{ pve_access_storage_role | quote }}
    {{ '--tokens' if item.1.is_token else '--users' }} {{ item.1.id | quote }}
  loop: "{{ pve_access_storages | product(pve_access_principals) | list }}"
  loop_control:
    label: "/storage/{{ item.0 }} -> {{ item.1.id }}"
  when: >-
    (pve_access_acl_raw.stdout | from_json
     | selectattr('path', 'equalto', '/storage/' ~ item.0)
     | selectattr('roleid', 'equalto', pve_access_storage_role)
     | selectattr('ugid', 'equalto', item.1.id)
     | list | length) == 0
  changed_when: true

# ── One-time secret disclosure ─────────────────────────────────────────────
# Deliberately not a handler. Handlers run at the end of the play, so any later
# failure would suppress this message entirely — and the secret is unrecoverable
# once the run ends without it having been displayed.

- name: Show the token secret once, for storing in the vault  # noqa: no-handler
  ansible.builtin.debug:
    msg: |-
      ─────────────────────────────────────────────────────────────────────
      API TOKEN CREATED — this secret is shown ONCE and cannot be recovered.

        Token ID : {{ pve_access_token_full }}
        Secret   : {{ (pve_access_new_token.stdout | from_json).value }}

      Store it now:
        ansible-vault edit inventories/homelab/group_vars/all/vault.yml
        vault_pve_api_token_secret: "<the secret above>"

      If it is lost, delete and recreate the token:
        {{ pve_access_pveum }} user token remove {{ pve_access_user }} {{ pve_access_token_id }}
      ─────────────────────────────────────────────────────────────────────
  when:
    - pve_access_new_token is changed
    - not ansible_check_mode
