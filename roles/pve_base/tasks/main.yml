---
# Base host configuration. Runs before hardening, so it must be safe on a host
# that is still in its post-install state.

# Deliberately does NOT use ansible_facts (e.g. os_family). Confirmed by
# minimal reproduction: when a role is invoked from a `roles:` list with no
# tags of its own, inside a play that only carries a play-level tag, running
# with `--tags <something-scoped-to-one-task-in-the-role>` makes Ansible skip
# BOTH the implicit "Gathering Facts" step AND every untagged task in the
# role — including a task tagged `always`, which does not override this.
# Reproduced with a two-line throwaway role; not a --check artefact, not
# specific to localhost. Rather than chase the exact tag combination that
# avoids it, this check simply never depends on facts being gathered at all.
#
# /etc/pve existing and being a directory is already a strong, load-bearing
# signal on its own: it is Proxmox's cluster filesystem, present on every PVE
# node and essentially nothing else.
- name: Probe for the Proxmox cluster filesystem
  ansible.builtin.stat:
    path: /etc/pve
  register: pve_base_etc_pve
  changed_when: false
  check_mode: false

- name: Confirm this is a Proxmox VE host
  ansible.builtin.assert:
    that:
      - pve_base_etc_pve.stat.exists
      - pve_base_etc_pve.stat.isdir
    fail_msg: >-
      /etc/pve not found or not a directory. This role targets a Proxmox VE
      host — /etc/pve is Proxmox's cluster filesystem and exists on every PVE
      node; the inventory group `pve` is probably pointing somewhere
      unexpected.
    success_msg: "Proxmox VE host confirmed (/etc/pve present)"

- name: Include repository management
  ansible.builtin.include_tasks: repos.yml
  when: pve_base_manage_repos
  tags: [repos]

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ pve_base_packages }}"
    state: present
    # Refreshed by the repository tasks; avoid a second round-trip per run.
    update_cache: true
    cache_valid_time: 3600
  tags: [packages]

- name: Include time synchronisation
  ansible.builtin.include_tasks: chrony.yml
  when: pve_base_manage_chrony
  tags: [time]

- name: Include the thin-pool guard
  ansible.builtin.include_tasks: thin_pool_guard.yml
  tags: [storage, guard]

- name: Include nested virtualisation
  ansible.builtin.include_tasks: nested_virt.yml
  when: pve_base_nested_virt
  tags: [kvm]

- name: Include sensor detection
  ansible.builtin.include_tasks: sensors.yml
  tags: [sensors]

- name: Include fan detection
  ansible.builtin.include_tasks: fans.yml
  tags: [sensors, fans]

- name: Apply the sysctl baseline
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/60-pve-base.conf
    sysctl_set: true
    state: present
    reload: true
  loop: "{{ pve_base_sysctl }}"
  loop_control:
    label: "{{ item.name }} = {{ item.value }}"
  tags: [sysctl]
