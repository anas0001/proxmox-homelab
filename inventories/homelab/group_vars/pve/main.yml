---
# Proxmox host role tuning
pve_security_ssh_allow_groups: "ssh-users"
pve_security_ssh_port: 22
pve_security_mgmt_cidr: "192.168.1.0/24"     # optional direct-console source for 22/8006
pve_security_allow_tailscale: true            # firewall: allow 22/8006 from tailscale0 / 100.64.0.0/10
pve_security_tailscale_cidr: "100.64.0.0/10"  #   (you already reach the host over Tailscale)
# --- Tailscale ENROLMENT automation is OPTIONAL ---
# The host is already on the tailnet (you joined it manually), so leave this false and you do
# NOT need vault_tailscale_auth_key. Set true only to have Ansible (re)install & enrol Tailscale
# unattended (host rebuilds, or enrolling lab VMs / a subnet router for 10.10.10.0/24).
pve_tailscale_enabled: false
pve_tailscale_tags: "tag:homelab"
# pve_tailscale_auth_key: "{{ vault_tailscale_auth_key }}"   # only if pve_tailscale_enabled: true (no_log)
# pve_tailscale_advertise_routes: "10.10.10.0/24"           # only if you want VMs reachable over the tailnet
pve_security_enable_fail2ban: true
pve_security_enable_auditd: true
pve_network_bridges:
  - {name: vmbr0, comment: "management + LAN uplink"}
  - {name: vmbr1, vlan_aware: true, comment: "isolated lab L2 (no uplink)"}
