---
# Non-secret defaults. Secrets are referenced from Vault via vault_* aliases.
# ── Proxmox API (secret pulled from Vault) ──────────────────────────
pve_api_token_secret: "{{ vault_pve_api_token_secret }}"
pve_api_validate_certs: true            # set false only for an internal-CA/self-signed lab, and document it

# ── Storage ─────────────────────────────────────────────────────────
pve_vm_storage: "local-lvm"             # thin pool for VM disks
pve_iso_storage: "local"
pve_thin_pool_warn_percent: 80          # pve_base guard fails above this

# ── Cloud-init golden templates ─────────────────────────────────────
vm_templates:
  rocky9:
    vmid: 9000
    name: tmpl-rocky9
    image_url: "https://download.rockylinux.org/pub/rocky/9/images/x86_64/Rocky-9-GenericCloud.latest.x86_64.qcow2"
# ubuntu2404: build on demand

# ── Admin identity injected into guests via cloud-init ──────────────
guest_admin_user: svc_admin
guest_admin_ssh_key: "{{ vault_guest_admin_ssh_pubkey }}"   # PUBLIC key only

# ── Lab network defaults (examples; override per site) ──────────────
lab_nat_subnet: "10.10.10.0/24"
lab_nat_gateway: "10.10.10.1"
lab_domain: "homelab.local"
# The isolated lab bridge. Defined here rather than only in
# roles/pve_network/defaults/main.yml because TWO roles in DIFFERENT plays
# need it: pve_network builds the bridge (pve_bootstrap.yml) and pve_security
# writes a firewall rule scoped to it (pve_harden.yml, which loads only
# pve_security). A role default is in scope solely for tasks running inside
# that role, so pve_security referencing pve_network_lab_bridge would fail
# with "'pve_network_lab_bridge' is undefined" — the same trap already
# documented for pve_base_proxmoxer_venv below.
lab_bridge: vmbr1

# ── Time ────────────────────────────────────────────────────────────────
# One timezone for the Proxmox host and every lab guest, present and future.
# Defined here rather than in either role because it has to be in scope for
# BOTH pve_bootstrap.yml (pve_base) and configure_guests.yml (guest_base);
# a role default is only in scope inside its own role.
#
# `Europe/London` is the tzdata zone, NOT a fixed offset — it carries the
# GMT/BST transition rules, so guests follow British Summer Time on their own
# with nothing to change twice a year. Writing `GMT` or `UTC+1` instead would
# pin an offset and be wrong for half the year, in opposite directions.
#
# Note the trade being made: UTC everywhere makes correlating logs across the
# host and a dozen guests trivial, because nothing has to be mentally shifted
# and no timestamp is ambiguous. Europe/London reintroduces one genuinely
# ambiguous hour each autumn, when 01:00-02:00 local happens twice. That is a
# real cost paid for the convenience of machines that agree with the clock on
# the wall. If log correlation ever becomes the bigger problem, this is the
# single line to change.
lab_timezone: "Europe/London"

# ── Shell prompt ────────────────────────────────────────────────────────
# A coloured prompt on the Proxmox host and every lab guest. Defined here
# rather than in either role because both pve_base (pve_bootstrap.yml) and
# guest_base (configure_guests.yml) render it, and a role default is only in
# scope inside its own role — so this is the one place the colour is set and
# the two cannot drift apart.
#
# ANSI foreground codes: 31 red, 32 green, 33 yellow, 34 blue, 36 cyan.
#
# The hostname is part of the prompt, which is what actually tells you whether
# you are on the hypervisor or in a guest. Worth knowing: making the HOST a
# different colour from the guests is a cheap safeguard, given the commands
# that get typed on a hypervisor. Set pve_base_prompt_colour separately if you
# ever want that; it defaults to this shared value.
shell_prompt_manage: true
shell_prompt_colour: "32"

# ── Python venv for community.proxmox ────────────────────────────────
# Defined here (group_vars/all), not inside roles/pve_base/defaults/main.yml,
# because it must resolve in playbooks/provision_vms.yml too, and that play
# never invokes the pve_base role — role defaults are only in scope for
# tasks running inside that role itself. Confirmed the failure mode directly
# rather than assumed: a play referencing a role-default variable without
# that role present in the play fails with "'<var>' is undefined", not a
# silent fallback.
#
# pve_base creates the venv (roles/pve_base/tasks/proxmoxer_venv.yml);
# provision_vms.yml points ansible_python_interpreter at it. Debian 13's own
# python3-proxmoxer package is 2.2.0, and every community.proxmox module
# requires 2.3+ unconditionally — confirmed live against this host
# ("Requires proxmoxer 2.3 or newer; found version 2.2.0"), with no newer
# candidate in Debian's repos at all.
pve_base_proxmoxer_venv: /opt/proxmoxer-venv
