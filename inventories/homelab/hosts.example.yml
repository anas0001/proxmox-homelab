---
# SANITISED EXAMPLE. Copy to hosts.yml (gitignored) and set real values there.
# Do NOT put real IPs/hostnames/tokens in this committed file.
all:
  children:
    pve:                       # the Proxmox host(s)
      hosts:
        pve01:
          ansible_host: 192.168.1.10        # example mgmt IP (RFC1918)
          ansible_user: svc_admin
          # Proxmox API endpoint used by community.proxmox.* modules
          pve_api_host: 192.168.1.10
          pve_api_user: ansible@pve
          pve_api_token_id: automation
          # secret comes from Vault -> see group_vars/all/vault.example.yml
          # The Proxmox node name (`pvecm status` / Datacenter -> node in the
          # UI), NOT the inventory hostname key above. vm_template/vm_provision
          # pass this as the `node:` parameter to community.proxmox.* modules.
          pve_node_name: pve01
    guests:                    # lab VMs (created by vm_provision; listed for guest config)
      children:
        linux_lab:
          hosts:
            node1: {ansible_host: 10.10.10.11}
            node2: {ansible_host: 10.10.10.12}
        storage_lab:
          hosts:
            ceph1: {ansible_host: 10.10.10.21}
            ceph2: {ansible_host: 10.10.10.22}
            ceph3: {ansible_host: 10.10.10.23}
        hpc_lab:
          hosts:
            hpc-head: {ansible_host: 10.10.10.31}
            hpc-c1: {ansible_host: 10.10.10.32}
            hpc-c2: {ansible_host: 10.10.10.33}
            hpc-c3: {ansible_host: 10.10.10.34}
  vars:
    ansible_python_interpreter: auto_silent
