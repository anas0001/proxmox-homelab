# Ansible configuration for the homelab project.
# Docs: https://docs.ansible.com/ansible/latest/reference_appendices/config.html
[defaults]
inventory              = inventories/homelab/hosts.yml
roles_path             = roles
collections_path       = .ansible/collections
host_key_checking      = True
retry_files_enabled    = False
# YAML-formatted task output. This was once the `community.general.yaml`
# callback, removed in community.general 12.0.0; it is now a native option on
# the default callback.
stdout_callback        = default
result_format          = yaml
callbacks_enabled      = ansible.posix.profile_tasks, ansible.posix.timer
forks                  = 10
interpreter_python     = auto_silent
nocows                 = True

# NOTE: `vault_password_file` is deliberately NOT set here.
#
# The vault password lives in a gitignored file, so pinning its path in
# committed configuration makes the repository unusable to anyone who does not
# already have that file — CI, a new collaborator, or anybody cloning to read
# the code. `ansible-lint` and `--syntax-check` both fail hard when the
# configured path is missing, even though linting never needs to decrypt
# anything.
#
# Environment-specific settings belong in the environment. Point Ansible at
# your password file with:
#
#     export ANSIBLE_VAULT_PASSWORD_FILE=.vault_pass
#
# The Makefile exports this automatically when .vault_pass is present, so the
# `make` targets work without any manual step.

# INI parsing note: this file's parser does NOT strip trailing comments from
# value lines. Writing `key = value  # explanation` yields a value that
# literally contains "# explanation". Keep comments on their own line.

[ssh_connection]
pipelining             = True
ssh_args               = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey

[privilege_escalation]
become                 = False
