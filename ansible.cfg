# Ansible configuration for the homelab project.
# Docs: https://docs.ansible.com/ansible/latest/reference_appendices/config.html
[defaults]
inventory              = inventories/homelab/hosts.yml
roles_path             = roles
collections_path       = .ansible/collections
host_key_checking      = True
retry_files_enabled    = False
stdout_callback        = yaml
callbacks_enabled      = ansible.posix.profile_tasks, ansible.posix.timer
forks                  = 10
interpreter_python     = auto_silent
# NOTE: no trailing comments on value lines. Ansible's INI parser does not
# strip them, so "= .vault_pass  # gitignored" yields a literal filename with
# the comment text in it. The file below is gitignored; never commit it.
vault_password_file    = .vault_pass
nocows                 = True

[ssh_connection]
pipelining             = True
ssh_args               = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey

[privilege_escalation]
become                 = False
